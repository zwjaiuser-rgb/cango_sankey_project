text><text x="807.000" y="881.555" font-size="16" fill="#607373" font-weight="400" text-anchor="end" stroke="#faf9f5" stroke-width="5" paint-order="stroke" stroke-linejoin="round">6.06 百万美元</text><rect x="1260" y="392.055000" width="16" height="134.550000" fill="#197b73"/><text x="1294.000" y="454.330" font-size="17" fill="#243b40" font-weight="500" text-anchor="start">困难家庭现金补助</text><text x="1294.000" y="479.330" font-size="16" fill="#607373" font-weight="400" text-anchor="start">10.35 百万美元</text><rect x="1260" y="548.605000" width="16" height="62.790000" fill="#478d99"/><text x="1294.000" y="575.000" font-size="17" fill="#243b40" font-weight="500" text-anchor="start">家庭创业／创收补助</text><text x="1294.000" y="600.000" font-size="16" fill="#607373" font-weight="400" text-anchor="start">4.83 百万美元</text><rect x="1260" y="633.395000" width="16" height="34.060000" fill="#c39a4c"/><text x="1294.000" y="645.425" font-size="17" fill="#243b40" font-weight="500" text-anchor="start">医疗服务投入</text><text x="1294.000" y="670.425" font-size="16" fill="#607373" font-weight="400" text-anchor="start">2.62 百万美元</text><rect x="1260" y="689.455000" width="16" height="39.520000" fill="#b98753"/><text x="1294.000" y="704.215" font-size="17" fill="#243b40" font-weight="500" text-anchor="start">教育服务投入</text><text x="1294.000" y="729.215" font-size="16" fill="#607373" font-weight="400" text-anchor="start">3.04 百万美元</text><rect x="1260" y="750.975000" width="16" height="138.970000" fill="#89959c"/><text x="1294.000" y="815.460" font-size="17" fill="#243b40" font-weight="500" text-anchor="start">实施、管理与制度建设</text><text x="1294.000" y="840.460" font-size="16" fill="#607373" font-weight="400" text-anchor="start">10.69 百万美元</text><path d="M64 978H1536" stroke="#d5ded8"/><text x="64.000" y="1014.000" font-size="16" fill="#607373" font-weight="400" text-anchor="start">每条流线均为报告成本或家庭转移金额，统一使用百万美元；中间节点流入与流出相等。</text><text x="64.000" y="1044.000" font-size="16" fill="#607373" font-weight="400" text-anchor="start">Likouala 地区中期评估报告家庭日消费提高约 25%，提示现金补助可能改善受益者生活；该结果限于当地评估。</text><text x="64.000" y="1074.000" font-size="16" fill="#607373" font-weight="400" text-anchor="start">这条资金链提供期间内的民生机制证据。项目金额与全国幸福度评分之间不存在可直接换算的贡献关系。</text><text x="64.000" y="1125.000" font-size="15" fill="#73817c" font-weight="400" text-anchor="start">来源：世界银行 Lisungi 项目完成报告（2024），附件 3、4。</text></svg>